name: Update profile art

# Refreshes the contribution graph + stats SVGs daily from real GitHub data.
# Runs daily, plus whenever you push to main, plus on-demand (Actions -> Run workflow).

on:
  schedule:
    - cron: "17 6 * * *"   # Runs daily at ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render streak & stats card SVG
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
